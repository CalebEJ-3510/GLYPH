[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glyph"
version = "0.1.0"
description = "Blue-team keylogger detection simulator — detects keylogging artifacts in Windows telemetry"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Blue Team Lab" }]

dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "rich>=13.0",
    "joblib>=1.3",
    "lxml>=4.9",
    "numpy>=1.24",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306",
    "python-evtx>=0.7.4",
]
dashboard = [
    "streamlit>=1.28",
    "plotly>=5.17",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "rules*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]